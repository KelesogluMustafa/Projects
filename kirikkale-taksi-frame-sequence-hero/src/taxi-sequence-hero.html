<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Sequence Hero</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0c;
      font-family: Arial, Helvetica, sans-serif;
    }
    .hero-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0b0b0c;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .toggle {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px 10px 16px;
      min-height: 46px;
      border-radius: 999px;
      color: #fff;
      background: rgba(12,12,12,.78);
      border: 1px solid rgba(255,205,0,.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      user-select: none;
    }
    .toggle__label {
      white-space: nowrap;
      font-size: 14px;
      line-height: 1;
    }
    .toggle__input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .toggle__switch {
      position: relative;
      width: 50px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      cursor: pointer;
      transition: background .25s ease;
    }
    .toggle__switch::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: transform .25s ease;
    }
    .toggle__input:checked + .toggle__switch {
      background: #ffcc00;
    }
    .toggle__input:checked + .toggle__switch::after {
      transform: translateX(22px);
    }
    .loading {
      position: absolute;
      left: 24px;
      bottom: 24px;
      z-index: 25;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      letter-spacing: .02em;
      background: rgba(12,12,12,.55);
      border: 1px solid rgba(255,255,255,.12);
      padding: 10px 12px;
      border-radius: 12px;
    }
    @media (max-width: 767px) {
      .toggle {
        top: 16px;
        right: 16px;
        padding: 8px 10px 8px 12px;
        min-height: 42px;
      }
      .toggle__label { font-size: 13px; }
      .loading {
        left: 16px;
        right: 16px;
        bottom: 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="hero-stage" id="heroStage">
    <canvas id="heroCanvas"></canvas>

    <label class="toggle" for="threeDToggle">
      <span class="toggle__label">3D Görünüm</span>
      <input class="toggle__input" id="threeDToggle" type="checkbox" checked />
      <span class="toggle__switch" aria-hidden="true"></span>
    </label>

    <div class="loading" id="loadingBox">Kareler yükleniyor...</div>
  </div>

  <script>
    (function () {
      const FRAME_COUNT = 80;
      const FRAME_PATH = './frames/taxi-';
      const FRAME_EXT = '.webp';
      const PAD = 3;
      const FREEZE_FRAME = 40; // 3D görünüm kapalıyken orta civar
      const EASE = 0.12;

      const canvas = document.getElementById('heroCanvas');
      const ctx = canvas.getContext('2d');
      const loadingBox = document.getElementById('loadingBox');
      const toggle = document.getElementById('threeDToggle');

      const frames = new Array(FRAME_COUNT);
      let loaded = 0;
      let allReady = false;

      let targetFrame = FREEZE_FRAME;
      let currentFrame = FREEZE_FRAME;
      let enabled = true;
      let rafId = null;

      function pad(n) {
        return String(n).padStart(PAD, '0');
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        const w = Math.round(window.innerWidth * dpr);
        const h = Math.round(window.innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        drawFrame(Math.round(currentFrame));
      }

      function drawFrame(index) {
        const img = frames[index];
        if (!img) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const canvasAspect = canvas.width / canvas.height;
        const imgAspect = img.naturalWidth / img.naturalHeight;

        let drawWidth, drawHeight, dx, dy;
        if (imgAspect > canvasAspect) {
          drawHeight = canvas.height;
          drawWidth = drawHeight * imgAspect;
          dx = (canvas.width - drawWidth) / 2;
          dy = 0;
        } else {
          drawWidth = canvas.width;
          drawHeight = drawWidth / imgAspect;
          dx = 0;
          dy = (canvas.height - drawHeight) / 2;
        }

        ctx.drawImage(img, dx, dy, drawWidth, drawHeight);
      }

      function updateLoading() {
        if (!loadingBox) return;
        if (loaded >= FRAME_COUNT) {
          loadingBox.style.display = 'none';
        } else {
          loadingBox.textContent = `Kareler yükleniyor... ${loaded}/${FRAME_COUNT}`;
        }
      }

      function maybeStart() {
        if (rafId === null) {
          rafId = requestAnimationFrame(animate);
        }
      }

      function animate() {
        currentFrame += (targetFrame - currentFrame) * EASE;
        drawFrame(Math.max(0, Math.min(FRAME_COUNT - 1, Math.round(currentFrame))));

        const settled = Math.abs(targetFrame - currentFrame) < 0.01;
        if (!settled) {
          rafId = requestAnimationFrame(animate);
        } else {
          rafId = null;
        }
      }

      function setByPointer(clientX) {
        if (!enabled || !allReady) return;
        const progress = Math.max(0, Math.min(1, clientX / window.innerWidth));
        targetFrame = progress * (FRAME_COUNT - 1);
        maybeStart();
      }

      function setEnabled(next) {
        enabled = !!next;
        toggle.checked = enabled;
        if (!enabled) {
          targetFrame = FREEZE_FRAME;
          maybeStart();
        }
      }

      toggle.addEventListener('change', function () {
        setEnabled(toggle.checked);
      });

      window.addEventListener('pointermove', function (e) {
        setByPointer(e.clientX);
      }, { passive: true });

      window.addEventListener('mouseleave', function () {
        if (!enabled) return;
      });

      window.addEventListener('resize', resizeCanvas);

      // parent page support for future Elementor iframe integration
      window.addEventListener('message', function (event) {
        if (!event.data) return;

        if (event.data.type === 'taxi-sequence-pointer') {
          const x = Number(event.data.x);
          if (!Number.isNaN(x) && allReady) {
            const progress = Math.max(0, Math.min(1, (x + 1) / 2));
            targetFrame = progress * (FRAME_COUNT - 1);
            maybeStart();
          }
        }

        if (event.data.type === 'taxi-sequence-toggle') {
          setEnabled(!!event.data.enabled);
        }
      });

      function preloadFrames() {
        resizeCanvas();
        updateLoading();

        for (let i = 0; i < FRAME_COUNT; i++) {
          const img = new Image();
          img.decoding = 'async';
          img.onload = function () {
            loaded++;
            updateLoading();
            if (loaded === 1) {
              drawFrame(FREEZE_FRAME);
            }
            if (loaded >= FRAME_COUNT) {
              allReady = true;
              targetFrame = FREEZE_FRAME;
              currentFrame = FREEZE_FRAME;
              drawFrame(FREEZE_FRAME);
            }
          };
          img.src = FRAME_PATH + pad(i + 1) + FRAME_EXT;
          frames[i] = img;
        }
      }

      preloadFrames();
    })();
  </script>
</body>
</html>
